name: Build and publish APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h9-smart-drive-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Android SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build, test, and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk H9-Smart-Drive.apk

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.0-beta.2 H9-Smart-Drive.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "H9 Smart Drive v1.3.0 Beta 2" \
            --notes-file .github/release-notes-v1.3.0-beta.2.md \
            --prerelease
