name: Build and publish APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h9-smart-drive-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build, test, and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk H9-Smart-Drive.apk

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.0-beta.1 H9-Smart-Drive.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "H9 Smart Drive v1.3.0 Beta 1" \
            --notes-file .github/release-notes-v1.3.0-beta.1.md \
            --prerelease
